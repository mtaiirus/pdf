name: Daily PDF URL update

on:
  schedule:
    - cron: "30 0 * * *" # every day at 06:00 IST (00:30 UTC)
  workflow_dispatch: # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PDF URLs and append new ones
        run: python fetch_pdfs.py

      - name: Commit new data (if any)
        run: |
          git config user.name "pdf-url-bot"
          git config user.email "pdf-url-bot@users.noreply.github.com"
          git add data/pdf_urls.jsonl
          if git diff --cached --quiet; then
            echo "No new URLs today."
          else
            git commit -m "Add new PDF URLs ($(date -u +%Y-%m-%d))"
            git push
          fi
